services:
  - type: web
    name: ghostwriter-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FRONTEND_ORIGIN
        value: https://ghostwriterai-hectoberfect.netlify.app
      - key: GEMINI_API_KEY
        sync: false
